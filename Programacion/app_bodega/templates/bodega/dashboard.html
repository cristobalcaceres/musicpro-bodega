<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Bodega</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h1 class="mb-4">Music Pro Tour 2026 - Bodega Central</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info shadow-sm">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card bg-secondary text-light shadow">
                    <div class="card-body">
                        <h5 class="card-title">Inventario Actual</h5>
                        <p class="card-text">Revisa el stock, ubicaciones y alertas de los productos.</p>
                        <a href="{% url 'inventario' %}" class="btn btn-light">Ver Inventario</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
